<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Metode Pembayaran</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label, input, select, button, textarea {
            display: block;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Formulir Metode Pembayaran</h2>
    <form id="paymentForm">
        <label for="paymentMethod">Metode Pembayaran:</label>
        <select id="paymentMethod" name="paymentMethod">
            <option value="creditCard">Kartu Kredit</option>
            <option value="bankTransfer">Transfer Bank</option>
        </select>
        
        <label for="accountInfo">Informasi Akun (jika diperlukan):</label>
        <textarea id="accountInfo" name="accountInfo" rows="4" cols="50"></textarea>
        
        <label for="shippingAddress">Alamat Pengiriman:</label>
        <textarea id="shippingAddress" name="shippingAddress" rows="4" cols="50"></textarea>
        
        <button type="submit">Proses Pembayaran</button>
    </form>
</body>
</html>
