<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreSter</title>
    <link rel="stylesheet" href="keranjang.css">
</head>
<main>
    <div class="container">
        <h2>Keranjang Belanja</h2>
        <div class="cart-items">
            <!-- Daftar item yang ditambahkan ke keranjang -->
            <div class="cart-item">
                <img src="sepatu01.jpg" alt="Sepatu 1">
                <div class="item-details">
                    <h3>Nike Air Force 1 07 LX</h3>
                    <p>Rp 1,699,000</p>
                    <!-- Tambahkan tombol untuk menghapus item dari keranjang jika diperlukan -->
                    <button class="remove-item"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
            <!-- Item lainnya akan ditambahkan di sini -->
        </div>

        <!-- Total belanja -->
        <div class="total">
            <h3>Total Belanja:</h3>
            <p>Rp 1,699,000</p> <!-- Total harga dari semua item -->
        </div>

        <!-- Tombol untuk pembayaran dengan link ke halaman pembayaran -->
        <a href="pembayaran.html" class="payment-button">Pembayaran</a>

    </div>
</main>
</html>
